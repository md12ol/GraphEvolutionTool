[package]
name = "graph-evolution-tool"
version = "0.9.0-alpha.1"
edition = "2024"

[lib]
# Renaming this breaks every example, both front ends and `#[pymodule] fn get`
# at once — `use get::` and `import get` come from here, not from the package
# name above.
name = "get"
# Dropping `rlib` stops `cargo test` linking the crate; `cdylib` is the
# importable Python extension module.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "get-run"
path = "src/bin/run.rs"
required-features = ["cli"]

[features]
# Off by default, and `get-run` gates on it: `auto-initialize` embeds an
# interpreter, which the built Python extension module must not do.
cli = ["pyo3/auto-initialize"]

[dependencies]
# Adding `extension-module` here makes the whole test suite fail to LINK, with
# undefined `Py*` symbols; the built module supplies it through
# `pyproject.toml`'s `[tool.maturin] features`.
pyo3 = { version = "0.27.2", features = ["abi3-py38"] }

rayon = "1.8"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
# Without `auto-initialize` no test can start an interpreter to call a Python
# callable.
pyo3 = { version = "0.27.2", features = ["auto-initialize"] }

[lints.clippy]
# Explicit `return` is allowed where it aids readability.
needless_return = "allow"
