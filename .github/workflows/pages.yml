# Publishes documentation/ to GitHub Pages.
#
# Deploy-from-a-branch mode is not usable here: it serves only the repository
# root or /docs, so it would force documentation/ to be renamed. Uploading an
# artifact keeps the directory where it is.
#
# The site needs no build. It is hand-written static HTML with relative links
# and no external assets, so what Pages serves is the directory as committed.

name: pages

# Publication is deliberately decoupled from `main`. `documentation/` still changes
# in the same commit as the code that falsified it, so the page is correct on `main`
# before it is live; what waits is the reader seeing it. Decided 2026-09-11.
#
# Correcting a page that is ALREADY published is a disposable branch cut from the
# release tag, with the fix cherry-picked onto it and this workflow dispatched
# against that branch. workflow_dispatch on its own cannot do it: the checkout below
# takes a whole ref, so dispatching gives either the tag without the fix or `main`
# with everything unreleased. The fix must also land on `main`, or the next tag
# silently reverts it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read the tree, mint the deploy token, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that is already running is not cancelled — a half-finished one
# leaves the site serving a mix of two commits.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the site's references before publishing it
        # The same checker CI runs on every pull request. Repeated here because
        # this job also runs on workflow_dispatch, which can deploy a commit no
        # pull request ever gated.
        run: python3 documentation/check_refs.py

      # The zip being published is a committed file, so a stale one would ship
      # to readers rather than merely sitting in the tree.
      - name: Check the example bundle is current before publishing it
        run: python3 tools/build_bundle.py --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: documentation

      - id: deployment
        uses: actions/deploy-pages@v4
