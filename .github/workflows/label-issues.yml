# Applies the two labels that can be DERIVED from a new issue, so neither owner
# has to remember them. It sets nothing that needs judgement.
#
#   area:*        from the title's `component:` prefix, which `work/issue_style.md`
#                 rule 1 already requires every title to carry.
#   needs-ruling  when the body contains `Unknown: needs`, which `issue_style.md`
#                 rule 2 requires instead of a guessed solution.
#
# It also defaults the MILESTONE to `Backlog` when the issue arrives without one,
# because every open issue carries a milestone. The one exception is an issue for
# cutting a release, recognised by a `release:` title prefix: those sit outside a
# milestone deliberately, so a version milestone reaching 100% is an unambiguous
# signal to tag rather than a state that can only be reached after tagging.
#
# Deliberately NOT set here: the kind (`bug` / `enhancement` / `task` /
# `investigation`) and `breaking`. Both are calls about what the issue means, not
# facts about its text, and a workflow that guessed them would be wrong quietly.
# The filer sets those, per CLAUDE.md's "Filing issues".
#
# Additive only. It never removes a label, so a human decision always wins and an
# edit that drops `Unknown: needs` does not silently unlabel the issue. An unknown
# prefix is logged and left alone rather than guessed at, which is what keeps the
# label set closed: GitHub creates an unknown label as a side effect of using it.
#
# Like `assign-owner.yml` this is a convenience, not a gate. Nothing breaks if it
# fails and it blocks nothing.

name: label a new issue

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Title prefix to area. Every value must be a label that already
            // exists: a name that does not is created on use, silently.
            const AREA = {
              config: 'area:config',
              graph: 'area:graph',
              graph_io: 'area:graph',
              stats: 'area:graph',
              evolver: 'area:evolver',
              steady_state: 'area:evolver',
              generational: 'area:evolver',
              dispatch: 'area:evolver',
              scope: 'area:evolver',
              selection: 'area:evolver',
              replacement: 'area:evolver',
              genomes: 'area:genomes',
              edge_edit: 'area:genomes',
              sda: 'area:genomes',
              py_result: 'area:python',
              py_config: 'area:python',
              python: 'area:python',
              docs: 'area:docs',
              objective: 'area:docs',
              tools: 'area:tools',
              check_refs: 'area:tools',
              ci: 'area:ci',
              cargo: 'area:release',
              release: 'area:release',
              run: 'area:cli',
              cli: 'area:cli',
              examples: 'area:examples',
              analyze_output: 'area:examples',
            };

            const issue = context.payload.issue;
            const title = issue.title || '';
            const body = issue.body || '';
            const existing = (issue.labels || []).map(l => l.name);
            const add = [];

            const prefix = (title.split(':')[0] || '').trim();
            const area = AREA[prefix];
            if (!area) {
              core.info(`no area mapped for prefix "${prefix}", leaving it unlabelled`);
            } else if (existing.some(l => l.startsWith('area:'))) {
              core.info('an area label is already set, leaving it alone');
            } else {
              add.push(area);
            }

            if (body.includes('Unknown: needs') && !existing.includes('needs-ruling')) {
              add.push('needs-ruling');
            }

            if (add.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: add,
              });
              core.info(`added ${add.join(', ')}`);
            } else {
              core.info('no labels to add');
            }

            // Every open issue carries a milestone. An issue for cutting a
            // release is the one exception and is left alone: it sits outside so
            // that a version milestone reaching 100% means "time to tag" rather
            // than a state only reachable after tagging.
            if (issue.milestone) {
              core.info('milestone already set, leaving it alone');
              return;
            }
            if (/^release:/i.test(title)) {
              core.info('a release issue is deliberately unmilestoned');
              return;
            }

            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const backlog = milestones.data.find(m => m.title === 'Backlog');
            if (!backlog) {
              core.info('no open milestone named Backlog, leaving it unset');
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              milestone: backlog.number,
            });
            core.info('defaulted the milestone to Backlog');
