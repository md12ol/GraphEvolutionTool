# Runs the checks that nothing else runs: the site's source references, the
# test suite, the two lint gates, and the `get/examples/` programs. Until this existed, `get/src`'s unit
# tests ran only when a maintainer remembered to run them locally, so the
# convention of committing each step once its own check has passed rested on a
# gate nobody's push met.
#
# The examples are here for a different reason than the tests. They are the
# only thing that exercises the Rust-library route — depend on the crate,
# assemble the run yourself — and narrowing anything that route needs produces
# no compile error inside `get` at all. Nothing in the crate calls that door.
#
# `get-run.yml` is the sibling job: it is the one that actually *runs* the
# `cli`-gated binary against the shipped config. This workflow compiles and
# lints that binary but never executes it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: test, clippy and rustfmt
    runs-on: ubuntu-latest
    # The whole job takes about 30 seconds, so this cap only ever fires on a
    # hang. That is not hypothetical here: calling Python from inside a rayon
    # closure deadlocks rather than failing, and was measured hanging until
    # killed. A hang carries no failing assertion to report, so without a cap
    # it would sit on a runner for the six-hour default instead.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cuts a cold ~90s dependency build to a few seconds on a cache hit.
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # The crate embeds a Python interpreter, so the test binary needs
      # libpython at link and run time. A setup-python interpreter is not on
      # the default loader path — derive LIBDIR rather than hardcoding a
      # version, which is what breaks when the runner moves.
      - name: Put libpython on the loader path
        shell: bash
        run: |
          set -euo pipefail
          libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          echo "LD_LIBRARY_PATH=${libdir}:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "libpython dir: ${libdir}"

      # Ahead of the Rust checks because it needs no build at all, and
      # because what it catches is invisible to every one of them: adding a
      # line to a file that carries an `ADD A ... STEP n` marker shifts the
      # site's `path:line` references to it, and nothing in the crate can
      # notice. It ran only when someone remembered to, which is the gate
      # `documentation/README.md` describes and PR #159 walked straight past —
      # its new `dispatch.rs` tests moved a marker 30 lines and left two pages
      # pointing at the wrong one. It matches the step number as well as the
      # chain, so a reference cannot pass by landing on the marker next door.
      # A step here, rather than a job of its own,
      # so the `main` ruleset's required check keeps the name it already has.
      - name: documentation references
        run: python3 documentation/check_refs.py

      # The site's accessibility work is static — a skip link, `aria-current`, an
      # inert closed sidebar, focus-visible controls — and nothing verified it.
      # pa11y drives a real browser against the four page shapes: the landing
      # page, a guide page, the reference table and an extension chain. It cannot
      # certify WCAG on its own, which is why the manual keyboard pass stays a
      # human job, but it catches a regression in what has already been fixed.
      #
      # `continue-on-error` deliberately: this is the first run of a tool nobody
      # here has tuned, and a documentation edit should not be blocked by a rule
      # we have not yet decided we accept. Tighten it once its output is trusted.
      #
      # The exit codes are the reason this loop is not a one-liner. pa11y exits 2
      # when it found accessibility issues and 1 when it could not run at all —
      # and the first version of this step swallowed both with `|| true`, so four
      # pages that never opened reported green for a day. Chromium needs
      # `--no-sandbox` on the runner, which pa11y takes only from a config file;
      # a launch failure is now a hard `exit 1` that `continue-on-error` reports
      # without blocking, while findings stay advisory until we accept the rule.
      - name: accessibility
        continue-on-error: true
        run: |
          npm install --no-save pa11y@8
          python3 -m http.server 8123 --directory documentation &
          sleep 3
          broken=0
          for page in index.html guide/getting-started.html \
                      guide/configuration.html guide/new-genome.html; do
            echo "::group::pa11y ${page}"
            status=0
            npx pa11y --config documentation/pa11y.json \
                      --standard WCAG2AA "http://localhost:8123/${page}" || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 1 ]; then
              echo "::error::pa11y could not run against ${page}"
              broken=1
            fi
          done
          [ "$broken" -eq 0 ] || exit 1

      # The downloadable bundle and the page listing its files are both
      # generated from `get-examples/` and both committed, so either can go a
      # version behind the directory it was built from without anything saying
      # so — and a download that is stale is worse than no download. A step
      # here, rather than a job of its own, so the `main` ruleset's required
      # check keeps the name it already has.
      - name: example bundle is current
        run: python3 tools/build_bundle.py --check


      # First of the Rust checks: it is the cheapest of them and needs no
      # build, so a formatting-only failure reports in seconds instead of
      # after a compile.
      - name: cargo fmt --check
        run: cargo fmt -p graph-evolution-tool --check

      # `--features cli` so the `get-run` binary is covered too. It is
      # `required-features = ["cli"]`, so without the flag cargo skips that
      # target outright: it is neither linted nor built for tests, and any
      # `#[test]` added to it would silently never run.
      - name: cargo clippy
        run: cargo clippy -p graph-evolution-tool --all-targets --features cli -- -D warnings

      - name: cargo test
        run: cargo test -p graph-evolution-tool --features cli

      # `check_refs.py` proves a block points where it says; this proves the
      # code in it works: Python blocks type-checked against the shipped stub,
      # TOML blocks fed to the real loader.
      #
      # This step used to say `cargo test` above already built the `get-run` the
      # TOML half needs. It does not, and the claim went unchecked for as long as
      # it stood: every CI run reported `toml examples: skipped, no get-run
      # binary` and passed, so six blocks were verified on developer machines and
      # never here. Build it explicitly rather than inferring it from another
      # step's side effects — and note the checker's skips are now annotations,
      # so the next one of these is visible on the run rather than buried.
      # `--release` is not tidiness. The checker prefers a release binary and
      # falls back to a debug one, so a debug build still passes — it just runs
      # the site's configs through an unoptimised evolutionary algorithm, which
      # took this step from 9 seconds locally to 12 minutes on the runner,
      # against a 15-minute job cap. Same six blocks, same result, 80x the wall
      # clock.
      - name: build get-run for the documentation examples
        run: cargo build --release -p graph-evolution-tool --bin get-run --features cli

      # `cargo test` above does not produce an importable module: it builds
      # pyo3 in its default configuration, not `extension-module`, which is
      # the opposite of what `maturin develop` needs (see
      # `.claude/reference/pyo3-maturin.md`). Without this the Python half of
      # the next step could not resolve `get` and would report itself skipped
      # rather than fail — which is exactly the silent gap PR #186 review
      # comment #3 found: the step existed, but nothing in CI ever gave it a
      # `get` to check against.
      # `maturin develop` refuses to run without an active virtualenv — the
      # runner's `setup-python` interpreter is not one, and installing straight
      # into it is exactly what failed here the first time this step was
      # written: `maturin` reported "Couldn't find a virtualenv or conda
      # environment" and the whole job failed rather than the check quietly
      # skipping itself. `GITHUB_PATH`/`GITHUB_ENV` make the venv the one every
      # later step sees, including `documentation examples run` below.
      - name: install get for the documentation examples to import
        run: |
          python3 -m venv .venv-docs
          # `GITHUB_ENV` takes effect in *later* steps, never the one writing
          # it — so `maturin` in this same step still saw no virtualenv and
          # failed. Export it here for this step, and write it to GITHUB_ENV
          # for the next one.
          export VIRTUAL_ENV="$PWD/.venv-docs"
          export PATH="$PWD/.venv-docs/bin:$PATH"
          echo "VIRTUAL_ENV=$PWD/.venv-docs" >> "$GITHUB_ENV"
          echo "$PWD/.venv-docs/bin" >> "$GITHUB_PATH"
          pip install --quiet maturin mypy
          maturin develop --release -m get/Cargo.toml

      - name: documentation examples run
        run: python3 tools/check_doc_examples.py

      # The examples are the only proof that the Rust-library route reaches
      # what it promises. Narrowing something only an external caller needs
      # produces no compile error anywhere inside `get`, so these programs are
      # what fails instead — but only if something actually builds and runs
      # them. `cargo test` does not: it builds an example's target but never
      # executes its `main`, so a program that compiles and then panics on its
      # first line would pass every check above.
      #
      # Globbed rather than named, so a fifth example is covered by existing
      # here rather than by someone remembering to add a line. `--features cli`
      # matches the two steps above so this reuses their build instead of
      # triggering a fresh one.
      - name: Run every example
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for path in get/examples/*.rs; do
            name="$(basename "$path" .rs)"
            found=$((found + 1))
            echo "::group::example ${name}"
            cargo run -q -p graph-evolution-tool --features cli --example "$name"
            echo "::endgroup::"
          done
          # A glob that matches nothing would make this step silently pass and
          # report success for running no programs at all, which is the same
          # blind spot the step exists to close.
          test "$found" -gt 0 || { echo "::error::no examples found under get/examples/"; exit 1; }
          echo "ran ${found} example(s)"
