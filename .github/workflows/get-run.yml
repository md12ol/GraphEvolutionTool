# Builds and runs `get-run`, the config-driven Rust route (route 4).
#
# This job exists because nothing else builds this binary. It is gated behind
# the `cli` feature, so `cargo build`, `cargo test` and the wheel job all skip
# it — which is how it silently went stale while the Python path was changed
# around it. A route is not supported if the build proving it works is one
# nobody runs.
#
# It runs the shipped `config.example.toml` unmodified rather than a shrunk
# copy: that verifies the example as well as the binary, and a full run costs
# about four seconds in release.

name: get-run

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. Without this every push starts a full duplicate
# set and the superseded runs continue to completion — six pushes to a branch in
# an afternoon meant five complete runs whose results nobody would ever read.
#
# `cancel-in-progress` is deliberately conditional rather than `true`. A
# superseded pull-request run is waste and is cancelled; a run on `main` or on a
# `v*` tag is not, because that is the one that publishes, and cancelling a
# release mid-flight is a far worse failure than paying for a duplicate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-run:
    name: build and run the config-driven route
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Cuts a cold ~90s dependency build to a few seconds on a cache hit.
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # `cli` pulls in `pyo3/auto-initialize`, which embeds an interpreter, so
      # the binary needs libpython at link and run time. A setup-python
      # interpreter is not on the default loader path — derive LIBDIR rather
      # than hardcoding a version, which is what breaks when the runner moves.
      - name: Put libpython on the loader path
        shell: bash
        run: |
          set -euo pipefail
          libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          echo "LD_LIBRARY_PATH=${libdir}:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "libpython dir: ${libdir}"

      - name: Build get-run
        run: cargo build --release -p graph-evolution-tool --features cli --bin get-run

      # The run writes its three output files into the current directory, so it
      # runs in a scratch directory and is checked there in the same step —
      # splitting the two would mean rediscovering where the files landed.
      - name: Run the shipped example end to end, and check what it wrote
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/config.example.toml" .
          # Fixed seed so a failure is reproducible from the log.
          "$GITHUB_WORKSPACE/target/release/get-run" config.example.toml 7

          # Every run makes its own <timestamp>-<seed>/ folder, so the job has to
          # find it rather than assume the working directory. Exactly one should
          # exist: a second would mean the stamp is not unique per invocation,
          # which is the property the folder is for.
          shopt -s nullglob
          stamped=( [0-9]*-7/ )
          test "${#stamped[@]}" -eq 1 \
            || { echo "::error::expected one <timestamp>-7/ folder, found ${#stamped[@]}"; exit 1; }
          cd "${stamped[0]}"
          echo "run wrote into ${stamped[0]}"

          # `config.toml`, not `best_individual.txt.toml`: the provenance copy
          # belongs to the invocation rather than to one replicate, so
          # `save_config` writes it once into the folder the replicates share.
          for f in run_log.csv best_individual.txt config.toml; do
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
          done
          # A run of N generations logs iterations 0..N, plus the CSV header.
          # Derived from the config rather than hardcoded, so editing the
          # example's generation count does not fail this job with a stale
          # number and no clue why.
          gens="$(grep -oE '^num_generations[[:space:]]*=[[:space:]]*[0-9]+' ../config.example.toml | grep -oE '[0-9]+$')"
          test -n "$gens" || { echo "::error::could not read num_generations from the example"; exit 1; }
          expected=$(( gens + 2 ))
          rows="$(wc -l < run_log.csv)"
          test "$rows" -eq "$expected" \
            || { echo "::error::run_log.csv has $rows lines, expected $expected for $gens generations"; exit 1; }
          head -1 run_log.csv | grep -q '^iteration,best_fitness,' \
            || { echo "::error::run_log.csv header is not what the writer emits"; exit 1; }
          echo "run wrote 3 files; run_log.csv has $rows lines"

          # The fitness climb (about 11 -> 89 on this config) is deliberately
          # NOT asserted. It is stochastic, and float and rayon ordering differ
          # across platforms, so a threshold here would flake and then be
          # switched off — taking the checks above with it.
