# Example configuration for the Graph Evolution Tool (GET).
#
# Copy to `config.toml` and adjust. Fields map onto `get::config::Config`.
# Commented blocks show the alternative choices for each tagged section.

# --- Shared evolution settings ------------------------------------------------

population_size = 200        # number of individuals per generation
network_size    = 100        # number of nodes in every expressed graph

# Edge-weight cap. 1 = unweighted (the default if this line is omitted);
# values up to 5 allow parallel edges / multigraphs.
max_edge_multiplicity = 1

crossover_rate = 0.9         # probability a selected pair is recombined
mutation_rate  = 0.2         # probability a child is mutated

# How many mutations a mutating child takes, drawn uniformly from 1..=max_mutations
# (the default if this line is omitted is 1). `mutation_rate` decides whether a
# child mutates at all; this decides how many mutations it then takes. Must be at
# least 1. Note that one mutation is one gene for edge-edit and one transition for
# SDA, so the same count is not the same disruption across representations.
max_mutations = 1

# --- Evolution strategy -------------------------------------------------------
# Generational: replace the whole population each generation, keeping elites.

[evolution]
type            = "generational"
num_generations = 500
elite_count     = 1          # best individuals carried forward (default 1)

# Steady-state alternative: one mate-and-replace event at a time.
# [evolution]
# type              = "steady_state"
# num_mating_events = 100000

# --- Parent selection ---------------------------------------------------------

[selection]
type            = "tournament"
tournament_size = 5          # larger = stronger selection pressure

# --- Genome representation ----------------------------------------------------
# Edge-edit: an edit script applied to a base graph.

[genome]
type        = "edge_edit"
gene_length = 256            # number of edit operations per genome

# Relative probability of drawing each edit operation, used when generating and
# mutating genes. Weights are relative, not percentages: all-equal is the same
# distribution whether every value is 1.0 or 10.0. Omit the table to leave every
# operation at 1.0, omit individual lines to leave just those at 1.0, or set an
# operation to 0.0 to disable it outright. At least one must be positive.
# [genome.operation_weights]
# toggle       = 1.0
# hop          = 1.0
# add          = 1.0
# delete       = 1.0
# swap         = 1.0
# local_toggle = 1.0
# local_add    = 1.0
# local_delete = 1.0
# null         = 0.0        # e.g. drop the no-op so every gene does something

# SDA alternative: a self-driving automaton that generates a graph from scratch.
# There is no `num_chars`: the alphabet is derived as max_edge_multiplicity + 1,
# so every character is a legal edge weight and none is ever clamped away.
# [genome]
# type         = "sda"
# num_states   = 12
# max_resp_len = 4
# init_state   = 0           # starting state; must be < num_states (default 0)

# --- Fitness objective --------------------------------------------------------
# Three objectives read the same SIR simulation over the expressed graph, and
# share the parameter block below: epi_spread (total ever-infected, maximized),
# epi_length (timesteps to burn out, maximized), and epi_prof_match (RMSE against
# a target profile, minimized). Direction is fixed by the objective and is
# deliberately not configurable.
#
# No seed appears anywhere in this file. One master seed is passed to `run()`
# and the population, evolution, epidemics and replicate stream all derive from
# it, so replicates differ in their epidemics as well as their evolution.
#
# Migrating an older config: delete its `seed` line. A leftover `seed` under
# [fitness] is rejected by name — silently ignoring it would look like it still
# controls the epidemics when it no longer does.
#
# `target_profile` is rejected the same way when the objective is not
# epi_prof_match. These two keys are named checks, not a general unknown-key
# sweep: any other unrecognized key under [fitness] is still ignored without a
# word, so check spelling against this file.

[fitness]
type           = "epi_spread"
infection_rate = 0.5         # per-edge transmission probability per timestep.
                             # Chosen for a visible selection gradient, not for
                             # realism: 0.05 is the plausible per-contact figure,
                             # but on a 100-node sparse graph an outbreak dies
                             # almost immediately whatever the topology, so every
                             # individual scores alike and selection has nothing
                             # to act on. Measured over 500 generations at 0.05,
                             # best fitness wanders 1.20 -> 1.30 -> 1.27 -> 1.20
                             # while edge count climbs 74 -> 116; at 0.5 it
                             # climbs 11.5 -> 22 -> 52 -> 71.5. The first thing a
                             # new user runs has to visibly do something.
num_epidemics  = 30          # outbreaks averaged per evaluation
# patient_zero = 0           # optional: pin the seed node; omit for a random one

# Outbreaks shorter than min_epidemic_length are discarded and re-simulated, up
# to max_epidemic_retries attempts; whatever the last attempt gives is kept. A
# fizzled outbreak says the dice went badly, not that the network is poor. Both
# default to the values shown, which are the legacy C++ constants. Set
# min_epidemic_length = 1 to disable the re-roll. Note this is a biased resample,
# not variance reduction — it is not interchangeable with raising num_epidemics.
# min_epidemic_length  = 3
# max_epidemic_retries = 5

# Epidemic-length alternative: same parameters, different reading of the run.
# [fitness]
# type           = "epi_length"
# infection_rate = 0.05
# num_epidemics  = 30

# Profile-matching alternative: adds a target profile to match against. The
# profile is written here in full rather than pointed at, so this document alone
# reproduces the run. It is compared verbatim — nothing is prepended for patient
# zero and nothing is rescaled for the network size, unlike the legacy C++ loader,
# so supply the curve you want at the size of the network you are building. One
# element per timestep, all finite, and at least one of them. Whole numbers may
# be written without a decimal point. The profile belongs to this objective
# alone: leaving it behind after switching `type` back is an error, not a
# silently discarded key.
# [fitness]
# type           = "epi_prof_match"
# infection_rate = 0.05
# num_epidemics  = 30
# target_profile = [1, 3, 8, 17, 24, 19, 11, 5, 2, 1]

# Python fitness alternative: select "python" here, then call
# `evolver.set_fitness_function(callable, direction)` from Python before `run()`.
# The callable receives a batch and returns one float per graph, and declares its
# own direction at registration:
#   def fitness(batch):  # batch: list[(num_nodes, list[(u, v, weight)])]
#       return [score(n, edges) for (n, edges) in batch]
# [fitness]
# type = "python"
