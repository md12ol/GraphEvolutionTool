# Example configuration for the Graph Evolution Tool (GET).
#
# Copy to `config.toml` and adjust. It holds TWO complete setups: the first is
# live, the second is commented out below it. To switch, comment the first out
# and uncomment the second — no key here is edited in isolation, and no block
# from one setup makes sense inside the other.
#
#   Setup A (live)        edge-edit genome, generational strategy, epi_spread
#   Setup B (commented)   SDA genome, steady-state strategy, epi_prof_match
#
# This file is short on purpose: it is what you copy, not what you read. The
# documentation site explains these settings where it explains the thing they
# control -- `documentation/guide/route-python-toml.html` walks a whole document,
# `fitness.html` covers the objectives and `variation.html` the operators. There
# is no single page listing every key with all of its alternatives.
#
# `examples/config_builder.py` builds setup A as typed Python objects, for the
# route that constructs a config in code instead of reading one.


# =============================================================================
# SETUP A — edge-edit + generational + epi_spread
# =============================================================================

population_size       = 200
network_size          = 100
max_edge_multiplicity = 1     # 1 = unweighted; up to 5 allows parallel edges

crossover_rate = 0.9          # chance a selected pair recombines
mutation_rate  = 0.2          # chance a child mutates at all
max_mutations  = 1            # how many mutations it then takes, from 1..=this

[evolution]
type            = "generational"
num_generations = 500
elite_count     = 1

[scope]
# Which slice of the population one breeding event may touch.
type = "global"

[selection]
# Which of that slice becomes a parent. `tournament_size` sizes the tournament
# only; the scope has its own `size`.
type            = "tournament"
tournament_size = 5

[crossover]
type = "two_point"

[genome]
type        = "edge_edit"
gene_length = 256

# `base_graph` names a file the edit script starts from. It is a relative path
# from the location of THIS file, not from the directory you run in. Left unset,
# a run starts from an empty graph, which leaves five of the nine edit operations
# inert until `add` or `toggle` have built some structure.
# base_graph = "base_graph.csv"
#
# The file needs a `# nodes = N` header, and that count must equal network_size.
# It is read 0-indexed. For a file numbered from anything else, or for a config
# assembled in Python rather than read from a file, set it on the evolver
# instead: `set_base_graph(100, edges)`, or
# `set_base_graph_from_file("base_graph.csv", min_node_index=1)`, where
# `min_node_index` is where your own numbering starts and results come back in.

# Relative probability of drawing each edit operation. Omit the table to leave
# every operation at 1.0; at least one must be positive.
# [genome.operation_weights]
# toggle       = 1.0
# hop          = 1.0
# add          = 1.0
# delete       = 1.0
# swap         = 1.0
# local_toggle = 1.0
# local_add    = 1.0
# local_delete = 1.0
# null         = 0.0

[fitness]
type           = "epi_spread"
infection_rate = 0.5          # high on purpose: at 0.05 an outbreak on a sparse
                              # 100-node graph dies before topology matters, so
                              # every individual scores alike and selection has
                              # nothing to act on
num_epidemics  = 30
# patient_zero         = 0    # omit for a fresh random seed node per epidemic
# min_epidemic_length  = 3    # outbreaks shorter than this are re-simulated,
# max_epidemic_retries = 5    # up to this many times. Set length 1 to disable.

# ADD AN OBJECTIVE STEP 5 — an example block for your objective, commented out
# beneath this one. This file is what a user copies from, so an objective
# missing from it is one most people never find.
#     [fitness]
#     type       = "my_objective"
#     some_param = 1.0

# No seed appears anywhere in this file. One master seed goes to `run()`, and
# the population, evolution, epidemics and replicates all derive from it.


# =============================================================================
# SETUP B — SDA + steady-state + epi_prof_match
# =============================================================================
# Uncomment everything below and comment out setup A above.

# population_size       = 200
# network_size          = 100
# max_edge_multiplicity = 1
#
# crossover_rate = 0.9
# mutation_rate  = 0.2
# max_mutations  = 1
#
# [evolution]
# type              = "steady_state"
# num_mating_events = 100000
# replacement       = { type = "worst" }   # the default; keeps the scope's best
# replacement       = { type = "random" }  # uniform; the scope's best can be overwritten
#
# [scope]
# # Steady-state needs at least 4 — two parents and the two they replace must
# # be distinct. This `size` is where its selection pressure comes from.
# type = "random_subset"
# size = 6
#
# [selection]
# # `random_subset` + `best` is what "tournament selection" decomposes into.
# type = "best"
#
# [crossover]
# type = "two_point"
#
# [genome]
# # The alphabet is derived as max_edge_multiplicity + 1, so there is no
# # `num_chars` and no character is ever clamped away.
# type                        = "sda"
# num_states                  = 12
# max_resp_len                = 4
# init_state                  = 0
# init_char_mutation_rate     = 0.04
# transition_vs_response_rate = 0.5
#
# [fitness]
# # Compared verbatim: nothing is prepended for patient zero and nothing is
# # rescaled, so supply the curve at the size of network you are building.
# type           = "epi_prof_match"
# infection_rate = 0.05
# num_epidemics  = 30
# target_profile = [1, 3, 8, 17, 24, 19, 11, 5, 2, 1]


# =============================================================================
# Extension points — the last step of each chain lives in this file
# =============================================================================
# Each is the step people skip and then wonder why nobody uses their addition:
# this file is what a new user copies from. The rest of each chain is in the
# code, findable with `git grep -n "ADD A <THING> STEP"`.

# ADD A STRATEGY STEP 7 — a commented-out `[evolution]` block for your strategy,
# carrying whatever stopping condition it reads:
#     [evolution]
#     type           = "my_strategy"
#     num_my_events  = 500
#
# ADD A SCOPE STEP 6 — a commented-out `[scope]` block naming your variant, with
# parameters of its own:
#     [scope]
#     type   = "neighbourhood"
#     radius = 2
#
# ADD A SELECTION STEP 6 — a commented-out `[selection]` block naming your
# scheme. Only the scheme's own parameters; the scope sizes itself:
#     [selection]
#     type     = "roulette"
#     pressure = 1.5
#
# ADD A CROSSOVER STEP 6 — a commented-out `[crossover]` block. This section
# applies to whichever genome is selected, so an operator only some
# representations can perform must be rejected in `Config::validate_crossover`:
#     [crossover]
#     type       = "my_crossover"
#     some_param = 0.5
#
# ADD A GENOME STEP 7 — a commented-out `[genome]` block for your
# representation, beside the ones already here:
#     [genome]
#     type           = "my_genome"
#     some_dimension = 256
#
# ADD A MUTATION STEP 4 (for EdgeEdit) — a `mutation` line under edge-edit's
# `[genome]`, which is what selects the operator:
#     [genome]
#     type        = "edge_edit"
#     gene_length = 256
#     mutation    = { type = "my_mutation" }
#
# ADD A MUTATION STEP 4 (for SDA) — a `mutation` line under SDA's `[genome]`,
# which is what selects the operator:
#     [genome]
#     type         = "sda"
#     num_states   = 12
#     max_resp_len = 4
#     mutation     = { type = "my_mutation" }


# =============================================================================
# Objectives this file does not show
# =============================================================================
# - "epi_length"   — same SIR parameters as epi_spread, read as timesteps to
#                    burn out rather than nodes reached. Maximized.
# - "struct_match" — scores a graph against a folder of real reference graphs.
#                    Not shown as a working setup because it needs reference
#                    data you do not have yet; every file in that folder must
#                    carry a `# nodes = N` header. Requires
#                    max_edge_multiplicity = 1.
# - "python"       — select it here, then call
#                    `evolver.set_fitness_function(callable, direction)` before
#                    `run()`. The callable takes a batch and returns one float
#                    per graph.
