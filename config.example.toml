# Example configuration for the Graph Evolution Tool (GET).
#
# Copy to `config.toml` and adjust. Fields map onto `get::config::Config`.
# Commented blocks show the alternative choices for each tagged section.
#
# There are two ways to reach a configuration, and this file is one of them.
# `the_shipped_example()` in `examples/config_builder.py` builds this same one
# as typed Python objects, so the two can be read side by side to see what a
# TOML key looks like from the other route.
#
# They match today, and nothing checks that they still do. That is deliberate:
# they exist to show the two routes, not to be locked together, and a test that
# failed whenever this file was edited alone would cost more than a drift does.

# --- Shared evolution settings ------------------------------------------------

population_size = 200        # number of individuals per generation
network_size    = 100        # number of nodes in every expressed graph

# Edge-weight cap. 1 = unweighted (the default if this line is omitted);
# values up to 5 allow parallel edges / multigraphs.
max_edge_multiplicity = 1

crossover_rate = 0.9         # probability a selected pair is recombined
mutation_rate  = 0.2         # probability a child is mutated

# How many mutations a mutating child takes, drawn uniformly from 1..=max_mutations
# (the default if this line is omitted is 1). `mutation_rate` decides whether a
# child mutates at all; this decides how many mutations it then takes. Must be at
# least 1. Note that one mutation is one gene for edge-edit and one transition for
# SDA, so the same count is not the same disruption across representations.
max_mutations = 1

# --- Evolution strategy -------------------------------------------------------
# Generational: replace the whole population each generation, keeping elites.

[evolution]
type            = "generational"
num_generations = 500
elite_count     = 1          # best individuals carried forward (default 1)

# Steady-state alternative: one mate-and-replace event at a time.
# [evolution]
# type              = "steady_state"
# num_mating_events = 100000

# --- Parent selection ---------------------------------------------------------
# Tournament is the only scheme GET ships. Adding another means editing your own
# copy of GET — selection is an enum rather than a trait, so unlike an objective
# or a genome it cannot be supplied from outside the crate. The `Selection` enum
# in get/src/evolver/common.rs documents every site such a scheme touches.

[selection]
type            = "tournament"
tournament_size = 5          # larger = stronger selection pressure

# --- Recombination operator ---------------------------------------------------
# Two-point is the only operator GET ships, and it is what every representation
# did before this section existed — so leaving the block out runs exactly as an
# older config did. `crossover_rate` above is separate and still applies: it
# decides WHETHER a pair recombines, this decides HOW.
#
# What two-point swaps depends on the representation: a band of genes for
# edge-edit, a band of states for SDA. Each also decides how much overlap it
# needs before crossing at all, and says so at its own `crossover`.
#
# Adding an operator of your own? This block is one of six places it has to
# touch, and the `Crossover` enum in get/src/evolver/common.rs walks all six in
# order. Note this section applies to WHICHEVER genome is selected, so an
# operator that only some representations can perform has to be rejected in
# `Config::validate_crossover` — nothing else pairs the two.
#
# ADD A CROSSOVER STEP 6 — an example block for your operator, here or as a
# commented-out alternative the way [evolution]'s steady-state does:
#
#     [crossover]
#     type       = "my_crossover"
#     some_param = 0.5
#
# Optional, and the step people skip and then wonder why nobody uses the
# operator: this file is what a new user copies from.

[crossover]
type = "two_point"

# --- Genome representation ----------------------------------------------------
# Edge-edit: an edit script applied to a base graph.
#
# The base graph itself is NOT a config value, and there is deliberately no key
# for it here: it is either data you brought or the output of a previous run,
# and neither belongs in a document that is meant to be the run's reproducible
# record. It arrives through the evolver instead, either as a list you already
# hold or as a file:
#
#     evolver.set_base_graph(100, edges)
#     evolver.set_base_graph_from_file("base_graph.csv", min_node_index=1)
#
# The file is one edge per line, `start,end,weight`. `min_node_index` is where
# your own node numbering starts — pass 1 for a 1-indexed file, and the results
# come back 1-indexed too. Left unset, a run starts from an empty graph, which
# leaves five of the nine edit operations inert until `add` or `toggle` have
# built some structure. See `examples/config_builder.py`, `seeding_from_a_file`.

# ADD A GENOME STEP 7 — a commented-out example block for your representation,
# alongside the SDA one further down:
#
#   # [genome]
#   # type           = "my_genome"
#   # some_dimension = 12
#
# The last of the seven steps listed in `get/src/genomes/genome.rs`, which has
# the other six. Optional and free to skip if the representation does not ship,
# but this file is what people copy from, so one left out is one most people
# never find.
[genome]
type        = "edge_edit"
gene_length = 256            # number of edit operations per genome

# Relative probability of drawing each edit operation, used when generating and
# mutating genes. Weights are relative, not percentages: all-equal is the same
# distribution whether every value is 1.0 or 10.0. Omit the table to leave every
# operation at 1.0, omit individual lines to leave just those at 1.0, or set an
# operation to 0.0 to disable it outright. At least one must be positive.
# [genome.operation_weights]
# toggle       = 1.0
# hop          = 1.0
# add          = 1.0
# delete       = 1.0
# swap         = 1.0
# local_toggle = 1.0
# local_add    = 1.0
# local_delete = 1.0
# null         = 0.0        # e.g. drop the no-op so every gene does something

# Which mutation edge-edit applies. Reroll-gene is the only one it ships, and
# what it always did before this became selectable — omit the line for the
# same effect.
# mutation = { type = "reroll_gene" }

# ADD A MUTATION STEP 4 — an example line for your edge-edit operator, here
# alongside reroll-gene, e.g.:
#
#   mutation = { type = "my_mutation", some_param = 0.5 }
#
# Optional, and the step people skip and then wonder why nobody uses the
# operator: this file is what a new user copies from.

# SDA alternative: a self-driving automaton that generates a graph from scratch.
# There is no `num_chars`: the alphabet is derived as max_edge_multiplicity + 1,
# so every character is a legal edge weight and none is ever clamped away.
#
# One mutation redraws either the initial character, one transition's target
# state, or one transition's response. The last two lines choose which: the
# first is the chance of taking init_char, and the second splits what is left
# between a target state and a response. Omit either to keep the value shown,
# which is what SDA used before these were configurable.
# [genome]
# type                        = "sda"
# num_states                  = 12
# max_resp_len                = 4
# init_state                  = 0     # starting state; must be < num_states
# init_char_mutation_rate     = 0.04
# transition_vs_response_rate = 0.5
# mutation                     = { type = "redraw_one" }  # the only one SDA ships; also the default

# ADD A MUTATION STEP 4 — an example line for your SDA operator, the same
# way as edge-edit's above. Optional, for the same reason.

# --- Fitness objective --------------------------------------------------------
# Three objectives read the same SIR simulation over the expressed graph, and
# share the parameter block below: epi_spread (total ever-infected, maximized),
# epi_length (timesteps to burn out, maximized), and epi_prof_match (RMSE against
# a target profile, minimized). Direction is fixed by the objective and is
# deliberately not configurable.
#
# No seed appears anywhere in this file. One master seed is passed to `run()`
# and the population, evolution, epidemics and replicate stream all derive from
# it, so replicates differ in their epidemics as well as their evolution.
#
# Migrating an older config: delete its `seed` line. A leftover `seed` under
# [fitness] is rejected by name — silently ignoring it would look like it still
# controls the epidemics when it no longer does.
#
# `target_profile` is rejected the same way when the objective is not
# epi_prof_match. These two keys are named checks, not a general unknown-key
# sweep: any other unrecognized key under [fitness] is still ignored without a
# word, so check spelling against this file.

# Adding an objective of your own? This block is one of six places it has to
# touch, and the module doc at the top of `get/src/fitness.rs` walks all six in
# order. An objective missing from this example file still works — it is just
# one most people never find, because this is the file they copy from.
[fitness]
type           = "epi_spread"
infection_rate = 0.5         # per-edge transmission probability per timestep.
                             # Chosen for a visible selection gradient, not for
                             # realism: 0.05 is the plausible per-contact figure,
                             # but on a 100-node sparse graph an outbreak dies
                             # almost immediately whatever the topology, so every
                             # individual scores alike and selection has nothing
                             # to act on. Measured over 500 generations at 0.05,
                             # best fitness wanders 1.20 -> 1.30 -> 1.27 -> 1.20
                             # while edge count climbs 74 -> 116; at 0.5 it
                             # climbs 11.5 -> 22 -> 52 -> 71.5. The first thing a
                             # new user runs has to visibly do something.
num_epidemics  = 30          # outbreaks averaged per evaluation
# patient_zero = 0           # optional: pin the seed node; omit for a random one

# Outbreaks shorter than min_epidemic_length are discarded and re-simulated, up
# to max_epidemic_retries attempts; whatever the last attempt gives is kept. A
# fizzled outbreak says the dice went badly, not that the network is poor. Both
# default to the values shown, which are the legacy C++ constants. Set
# min_epidemic_length = 1 to disable the re-roll. Note this is a biased resample,
# not variance reduction — it is not interchangeable with raising num_epidemics.
# min_epidemic_length  = 3
# max_epidemic_retries = 5

# Epidemic-length alternative: same parameters, different reading of the run.
# [fitness]
# type           = "epi_length"
# infection_rate = 0.05
# num_epidemics  = 30

# Profile-matching alternative: adds a target profile to match against. The
# profile is written here in full rather than pointed at, so this document alone
# reproduces the run. It is compared verbatim — nothing is prepended for patient
# zero and nothing is rescaled for the network size, unlike the legacy C++ loader,
# so supply the curve you want at the size of the network you are building. One
# element per timestep, all finite, and at least one of them. Whole numbers may
# be written without a decimal point. The profile belongs to this objective
# alone: leaving it behind after switching `type` back is an error, not a
# silently discarded key.
# [fitness]
# type           = "epi_prof_match"
# infection_rate = 0.05
# num_epidemics  = 30
# target_profile = [1, 3, 8, 17, 24, 19, 11, 5, 2, 1]

# Structure-matching alternative: score a graph on how closely its structure
# resembles a folder of real reference graphs, one edge-list file per graph.
# Minimized, and zero is a perfect match. Three size-invariant statistics are
# compared — degree, clustering, and the normalized Laplacian spectrum — so
# reference graphs of different sizes are all usable together.
#
# Unlike every other objective here the reference data is pointed at rather than
# written inline: a set of graphs is far too large to embed. Two consequences.
# The folder is NOT checked when the config is parsed, because validation does
# no I/O — a mistyped path is reported when the run starts instead. And this
# document no longer reproduces the run on its own; keep the reference folder
# with it.
#
# Requires max_edge_multiplicity = 1. The statistics count neighbours rather
# than summing weights, so a multigraph would be scored as though every parallel
# edge were a single one; that is rejected rather than silently flattened.
#
# Every key but reference_folder has the default shown, so `type` and
# reference_folder alone are a complete block.
#
# TWO WAYS A RUN CAN LOOK HEALTHY AND SEARCH NOTHING, both worth reading before
# setting the weights:
#
#   - A family whose reference set cannot support it. Rings and paths have
#     clustering coefficient 0 at every node, so a reference set drawn only from
#     those leaves clustering_weight set while the family it weights contributes
#     exactly nothing to any score. Nothing reports this. Set the weight to 0.0
#     deliberately, or give the reference set graphs that vary in the statistic.
#   - A gamma set too high. exp(-gamma * d^2) collapses to zero for every
#     candidate, the whole population scores ~1.0, and there is no gradient to
#     climb. Too high is the dangerous direction; start at 1.0 and lower it if
#     scores cluster at the top.
#
# The degree axis has no key. It is the one statistic with no natural bound, and
# its top is taken from the reference set — a value set too low would squash
# every reference graph into the last bin and retire the whole degree family.
# [fitness]
# type             = "struct_match"
# reference_folder = "reference_graphs"
# # Everything below is optional; these are the defaults.
# degree_bins       = 50
# clustering_bins   = 50
# spectral_bins     = 50
# degree_gamma      = 1.0
# clustering_gamma  = 1.0
# spectral_gamma    = 1.0
# degree_weight     = 1.0
# clustering_weight = 1.0
# spectral_weight   = 1.0
# density_weight    = 1.0

# Python fitness alternative: select "python" here, then call
# `evolver.set_fitness_function(callable, direction)` from Python before `run()`.
# The callable receives a batch and returns one float per graph, and declares its
# own direction at registration:
#   def fitness(batch):  # batch: list[(num_nodes, list[(u, v, weight)])]
#       return [score(n, edges) for (n, edges) in batch]
# [fitness]
# type = "python"
